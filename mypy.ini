[mypy]
strict = True

# Telethon and cryptg ship without type stubs / a py.typed marker. This is a
# property of the third-party packages, not a relaxation of our own strict
# typing rule (CLAUDE.md Section 1.1) — code we own is still fully typed.
[mypy-telethon.*]
ignore_missing_imports = True

[mypy-cryptg]
ignore_missing_imports = True
